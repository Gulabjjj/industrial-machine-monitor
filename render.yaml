services:
  - type: web
    name: industrial-machine-monitor
    runtime: docker
    plan: free        # use "free" if you only want a demo (it sleeps when idle)
    dockerfilePath: ./Dockerfile
    healthCheckPath: /vnc.html
    envVars:
      - key: VNC_PASSWORD   # optional: set in the Render dashboard to protect the UI
        sync: false
